name: Test Debian Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  test-debian:
    name: Test Debian Build (${{ matrix.arch }})
    runs-on: linux_amd64
    strategy:
      matrix:
        include:
          - arch: arm64
          - arch: amd64

    container:
      image: node:bookworm-slim

    steps:
      - name: Install git
        run: |
          apt-get update -qq
          apt-get install -y -qq git ca-certificates

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          apt-get install -y -qq cmake build-essential libasound2-dev

      - name: Install cross-compilation tools (non-amd64)
        if: matrix.arch != 'amd64'
        run: |
          dpkg --add-architecture ${{ matrix.arch }}
          apt-get update -qq
          apt-get install -y -qq crossbuild-essential-${{ matrix.arch }}

      - name: Install architecture-specific dependencies (non-amd64)
        if: matrix.arch != 'amd64'
        run: |
          apt-get install -y -qq libasound2-dev:${{ matrix.arch }} libstdc++6:${{ matrix.arch }}

      - name: Build and test with CMake
        run: |
          echo "=== Building and testing for ${{ matrix.arch }} ==="

          mkdir -p build
          cd build

          if [ "${{ matrix.arch }}" != "amd64" ]; then
            # Cross-compilation for ARM64
            cmake .. \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_SYSTEM_NAME=Linux \
              -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
              -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
              -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
              -DBUILD_TESTS=OFF
          else
            cmake .. -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF
          fi

          make -j$(nproc)

          echo ""
          echo "=== Build successful ==="
          find . -name "*.so" -type f
