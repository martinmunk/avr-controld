name: Build and Publish Alpine Packages

on:
  push:
    tags:
      - 'release/*'
  workflow_dispatch:

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  build-alpine-binaries:
    name: Build Alpine Binaries (${{ matrix.arch }})
    runs-on: linux_amd64
    strategy:
      matrix:
        include:
          - arch: arm64
            codename: stable
            alpine_arch: aarch64

    container:
      image: node:alpine

    steps:
      - name: Install git
        run: |
          apk add --no-cache git

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies and cross-compilation tools
        run: |
          # Install native build tools
          apk add --no-cache build-base cmake

          # Install ARM64 cross-compilation toolchain
          apk add --no-cache gcc-aarch64-none-elf g++-aarch64-none-elf

          # Add ARM64 architecture and install ARM64 alsa-lib
          apk add --no-cache --arch aarch64 alsa-lib-dev || \
            apk add --no-cache alsa-lib-dev

      - name: Build binaries with Alpine/musl for ARM64
        run: |
          echo "=== Building binaries for Alpine Linux (musl) (${{ matrix.arch }}) ==="

          mkdir -p build-alpine
          cd build-alpine

          # Cross-compile for ARM64
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/alsa-avr-control-alpine \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=aarch64-none-elf-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-none-elf-g++ \
            -DBUILD_TESTS=OFF
          make -j$(nproc)

          # Install to staging directory
          DESTDIR="$PWD/install" make install

          echo ""
          echo "=== Built files ==="
          find install -type f

      - name: Upload Alpine binaries
        uses: actions/upload-artifact@v3
        with:
          name: alpine-binaries-${{ matrix.arch }}
          path: build-alpine/install/**/*

  package-alpine:
    name: Package Alpine Build (${{ matrix.arch }})
    needs: build-alpine-binaries
    runs-on: linux_amd64
    strategy:
      matrix:
        include:
          - arch: arm64
            codename: stable

    container:
      image: node:bookworm-slim

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install packaging dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq dpkg-dev debhelper cmake libasound2-dev build-essential

      - name: Download Alpine binaries
        uses: actions/download-artifact@v3
        with:
          name: alpine-binaries-${{ matrix.arch }}
          path: alpine-binaries/

      - name: Package Alpine binaries as Debian package
        run: |
          echo "=== Packaging Alpine binaries as .deb ==="

          # Modify package name for Alpine build
          sed -i 's/^Package: martinmunk-alsa-control-avr$/Package: martinmunk-alsa-control-avr-alpine/' debian/control
          sed -i '/^Description:/a\ This Alpine-built package installs to /opt/alsa-avr-control-alpine/' debian/control

          # Create custom debian/rules for packaging pre-built binaries
          cat > debian/rules << 'EOF'
          #!/usr/bin/make -f

          %:
          	dh $@

          override_dh_auto_configure:
          	# Skip configure - binaries already built

          override_dh_auto_build:
          	# Skip build - binaries already built

          override_dh_auto_test:
          	# Skip tests

          override_dh_auto_install:
          	# Copy pre-built binaries from Alpine build
          	mkdir -p debian/martinmunk-alsa-control-avr-alpine
          	cp -r alpine-binaries/* debian/martinmunk-alsa-control-avr-alpine/

          override_dh_strip:
          	# Keep debug symbols
          	dh_strip --no-automatic-dbgsym

          override_dh_shlibdeps:
          	# Skip dependency analysis - these are musl binaries for Alpine containers
          	# They won't run on Debian hosts, only inside Alpine containers
          EOF

          chmod +x debian/rules

          # Build the package
          dpkg-buildpackage -us -uc -b

          echo ""
          echo "=== Build artifacts ==="
          ls -lh ../*.deb

          # Move to build directory
          mkdir -p build
          mv ../*.deb build/
          ls -lh build/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: alsa-avr-control-${{ matrix.codename }}-${{ matrix.arch }}
          path: build/*.deb

  publish-alpine:
    name: Publish Alpine to Package Registry
    needs: package-alpine
    runs-on: linux_amd64
    strategy:
      matrix:
        include:
          - arch: arm64
            codename: stable

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v3
        with:
          name: alsa-avr-control-${{ matrix.codename }}-${{ matrix.arch }}
          path: packages/

      - name: Publish to Gitea Package Registry
        env:
          GITEA_TOKEN: ${{ secrets.PACKAGE_REGISTRY_TOKEN }}
          GITEA_URL: ${{ github.server_url }}
        run: |
          # Find the .deb file
          PACKAGE_FILE=$(ls packages/*.deb | head -1)

          if [ -z "$PACKAGE_FILE" ]; then
            echo "No package file found!"
            exit 1
          fi

          # Extract package info
          PACKAGE_NAME=$(basename "$PACKAGE_FILE" | cut -d'_' -f1)
          PACKAGE_VERSION=$(basename "$PACKAGE_FILE" | sed 's/.*_\([0-9][^_]*\)_.*/\1/')

          echo "=== Publishing Alpine-built package to Gitea Debian Repository ==="
          echo "Package: $PACKAGE_NAME"
          echo "Version: $PACKAGE_VERSION"
          echo "Distribution: ${{ matrix.codename }} (Alpine/musl-built)"
          echo "Architecture: ${{ matrix.arch }}"
          echo "File: $PACKAGE_FILE"

          # Upload to Gitea Debian Package Repository under "stable" distribution
          curl -f -H "Authorization: token $GITEA_TOKEN" \
            --upload-file "$PACKAGE_FILE" \
            "$GITEA_URL/api/packages/${{ github.repository_owner }}/debian/pool/${{ matrix.codename }}/main/upload"

          if [ $? -eq 0 ]; then
            echo ""
            echo "========================================="
            echo "✅ Successfully published $PACKAGE_NAME $PACKAGE_VERSION"
            echo "   Distribution: ${{ matrix.codename }} (Alpine/musl-built binaries)"
            echo "   Architecture: ${{ matrix.arch }}"
            echo "   Install location: /opt/alsa-avr-control-alpine/"
            echo ""
            echo "Install on Pi (for volume-mounting to Alpine containers):"
            echo "  echo 'deb $GITEA_URL/${{ github.repository_owner }}/debian stable main' | sudo tee /etc/apt/sources.list.d/martinmunk-alpine.list"
            echo "  sudo apt update"
            echo "  sudo apt install $PACKAGE_NAME"
            echo ""
            echo "Volume mount into Alpine containers:"
            echo "  -v /opt/alsa-avr-control-alpine/lib/alsa-lib:/usr/lib/alsa-lib:ro"
            echo "  -v /opt/alsa-avr-control-alpine/etc/alsa/conf.d:/etc/alsa/conf.d:ro"
            echo "========================================="
          else
            echo "❌ Failed to publish package"
            exit 1
          fi
