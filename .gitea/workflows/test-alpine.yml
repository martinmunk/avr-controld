name: Test Alpine Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  test-alpine:
    name: Test Alpine Build (${{ matrix.arch }})
    runs-on: linux_amd64
    strategy:
      matrix:
        include:
          - arch: arm64

    container:
      image: node:alpine

    steps:
      - name: Install git
        run: |
          apk add --no-cache git

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies and cross-compilation tools
        run: |
          # Install native build tools
          apk add --no-cache build-base cmake

          # Install ARM64 cross-compilation toolchain for Linux
          apk add --no-cache aarch64-linux-musl-cross

          # Install ARM64 alsa-lib-dev
          apk add --no-cache alsa-lib-dev

      - name: Build and test with CMake for ARM64
        run: |
          echo "=== Building and testing for Alpine Linux (musl) (${{ matrix.arch }}) ==="

          mkdir -p build
          cd build

          # Cross-compile for ARM64 with musl toolchain
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/alsa-avr-control-alpine \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=/usr/bin/aarch64-linux-musl-gcc \
            -DCMAKE_CXX_COMPILER=/usr/bin/aarch64-linux-musl-g++ \
            -DCMAKE_FIND_ROOT_PATH=/usr/aarch64-linux-musl \
            -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY \
            -DBUILD_TESTS=OFF
          make -j$(nproc)

          echo ""
          echo "=== Build successful ==="
          find . -name "*.so" -type f

          # Run tests if available
          echo ""
          echo "=== Running tests ==="
          ctest --output-on-failure || true
