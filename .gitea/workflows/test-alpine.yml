name: Test Alpine Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  test-alpine:
    name: Test Alpine Build (${{ matrix.arch }})
    runs-on: linux_amd64
    strategy:
      matrix:
        include:
          - arch: arm64

    container:
      image: node:alpine

    steps:
      - name: Install git
        run: |
          apk add --no-cache git

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies and cross-compilation tools
        run: |
          # Install base build tools
          apk add --no-cache build-base cmake wget tar xz

          # Download and install aarch64-linux-musl cross compiler from musl.cc
          cd /tmp
          wget https://musl.cc/aarch64-linux-musl-cross.tgz
          tar -xzf aarch64-linux-musl-cross.tgz -C /opt
          rm aarch64-linux-musl-cross.tgz

          # Download and extract ARM64 Alpine packages for ALSA
          mkdir -p /opt/aarch64-sysroot/usr/lib /opt/aarch64-sysroot/usr/include
          wget https://dl-cdn.alpinelinux.org/alpine/v3.19/main/aarch64/alsa-lib-1.2.10-r0.apk
          wget https://dl-cdn.alpinelinux.org/alpine/v3.19/main/aarch64/alsa-lib-dev-1.2.10-r0.apk
          tar -xzf alsa-lib-1.2.10-r0.apk -C /opt/aarch64-sysroot
          tar -xzf alsa-lib-dev-1.2.10-r0.apk -C /opt/aarch64-sysroot
          rm -f *.apk

          # Add cross-compiler to PATH
          export PATH="/opt/aarch64-linux-musl-cross/bin:${PATH}"

      - name: Build and test with CMake for ARM64
        run: |
          echo "=== Building and testing for Alpine Linux (musl) (${{ matrix.arch }}) ==="

          # Add cross-compiler to PATH
          export PATH="/opt/aarch64-linux-musl-cross/bin:${PATH}"

          mkdir -p build
          cd build

          # Cross-compile for ARM64 with musl toolchain
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/alsa-avr-control-alpine \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=/opt/aarch64-linux-musl-cross/bin/aarch64-linux-musl-gcc \
            -DCMAKE_CXX_COMPILER=/opt/aarch64-linux-musl-cross/bin/aarch64-linux-musl-g++ \
            -DCMAKE_FIND_ROOT_PATH=/opt/aarch64-sysroot \
            -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY \
            -DCMAKE_CXX_FLAGS="-I/opt/aarch64-sysroot/usr/include" \
            -DCMAKE_C_FLAGS="-I/opt/aarch64-sysroot/usr/include" \
            -DCMAKE_EXE_LINKER_FLAGS="-L/opt/aarch64-sysroot/usr/lib" \
            -DBUILD_TESTS=OFF
          make -j$(nproc)

          echo ""
          echo "=== Build successful ==="
          find . -name "*.so" -type f

          # Run tests if available
          echo ""
          echo "=== Running tests ==="
          ctest --output-on-failure || true
