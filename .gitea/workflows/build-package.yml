name: Build Packages

on:
  push:
    branches:
      - main
    tags:
      - 'release/*'
  workflow_dispatch:

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  build-debian:
    name: Build Debian ${{ matrix.codename }} (${{ matrix.arch }})
    runs-on: linux_amd64
    strategy:
      matrix:
        include:
          - arch: arm64
            dist: debian:trixie
            codename: trixie
          - arch: amd64
            dist: debian:trixie
            codename: trixie

    container:
      image: node:bookworm-slim

    steps:
      - name: Install git
        run: |
          apt-get update -qq
          apt-get install -y -qq git ca-certificates

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install base build dependencies
        run: |
          apt-get install -y -qq dpkg-dev debhelper cmake lintian curl build-essential

      - name: Install cross-compilation tools (non-amd64)
        if: matrix.arch != 'amd64'
        run: |
          dpkg --add-architecture ${{ matrix.arch }}
          apt-get update -qq
          apt-get install -y -qq crossbuild-essential-${{ matrix.arch }}

      - name: Install architecture-specific dependencies
        run: |
          if [ "${{ matrix.arch }}" != "amd64" ]; then
            apt-get install -y -qq libasound2-dev:${{ matrix.arch }} libstdc++6:${{ matrix.arch }}
          else
            apt-get install -y -qq libasound2-dev
          fi

      - name: Build package
        run: |
          echo "=== Building for ${{ matrix.dist }} (${{ matrix.arch }}) ==="
          if [ "${{ matrix.arch }}" != "amd64" ]; then
            dpkg-buildpackage -us -uc -b -a${{ matrix.arch }}
          else
            dpkg-buildpackage -us -uc -b
          fi

          echo ""
          echo "=== Build artifacts ==="
          ls -lh ../*.deb

          # Move .deb files to build directory
          mkdir -p build
          mv ../*.deb build/ 2>/dev/null || true
          ls -lh build/

      - name: Validate package with lintian
        run: |
          echo "=== Validating package with lintian ==="
          cd build
          lintian --info --display-info *.deb || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: alsa-avr-control-${{ matrix.codename }}-${{ matrix.arch }}
          path: build/*.deb

  build-alpine:
    name: Build Alpine ${{ matrix.codename }} (${{ matrix.arch }})
    runs-on: linux_amd64
    strategy:
      matrix:
        include:
          - arch: arm64
            codename: stable

    container:
      image: node:alpine

    steps:
      - name: Install git
        run: |
          apk add --no-cache git

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build and packaging dependencies
        run: |
          apk add --no-cache build-base cmake alsa-lib-dev dpkg-dev debhelper perl

      - name: Build for Alpine
        run: |
          echo "=== Building for Alpine Linux (musl) (${{ matrix.arch }}) ==="

          # Modify package name to distinguish from Debian-built packages
          sed -i 's/^Package: martinmunk-alsa-control-avr$/Package: martinmunk-alsa-control-avr-alpine/' debian/control

          # Update package description to clarify install location
          sed -i '/^Description:/a\ This Alpine-built package installs to /opt/alsa-avr-control-alpine/' debian/control

          echo "Modified debian/control:"
          grep "^Package:" debian/control
          grep -A 1 "^Description:" debian/control

          # Override CMAKE_INSTALL_PREFIX to install to /opt/alsa-avr-control-alpine
          # This allows both native and alpine packages to be installed together
          {
            echo '#!/usr/bin/make -f'
            echo ''
            echo '%:'
            echo '	dh $@ --buildsystem=cmake'
            echo ''
            echo 'override_dh_auto_configure:'
            echo '	dh_auto_configure -- \'
            echo '		-DCMAKE_BUILD_TYPE=Release \'
            echo '		-DCMAKE_INSTALL_PREFIX=/opt/alsa-avr-control-alpine \'
            echo '		-DBUILD_TESTS=OFF'
            echo ''
            echo 'override_dh_auto_test:'
            echo '	# Skip tests during package build'
            echo ''
            echo 'override_dh_strip:'
            echo '	# Keep debug symbols for better diagnostics'
            echo '	dh_strip --no-automatic-dbgsym'
          } > debian/rules.alpine

          # Replace debian/rules with Alpine version
          mv debian/rules.alpine debian/rules
          chmod +x debian/rules

          dpkg-buildpackage -us -uc -b

          echo ""
          echo "=== Build artifacts ==="
          ls -lh ../*.deb

          # Move .deb files to build directory
          mkdir -p build
          mv ../*.deb build/ 2>/dev/null || true
          ls -lh build/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: alsa-avr-control-${{ matrix.codename }}-${{ matrix.arch }}
          path: build/*.deb

  publish-debian:
    name: Publish Debian to Package Registry
    needs: build-debian
    if: startsWith(github.ref, 'refs/tags/release/')
    runs-on: linux_amd64
    strategy:
      matrix:
        include:
          - arch: arm64
            codename: trixie
          - arch: amd64
            codename: trixie

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v3
        with:
          name: alsa-avr-control-${{ matrix.codename }}-${{ matrix.arch }}
          path: packages/

      - name: Publish to Gitea Package Registry
        env:
          GITEA_TOKEN: ${{ secrets.PACKAGE_REGISTRY_TOKEN }}
          GITEA_URL: ${{ github.server_url }}
        run: |
          # Find the .deb file
          PACKAGE_FILE=$(ls packages/*.deb | head -1)

          if [ -z "$PACKAGE_FILE" ]; then
            echo "No package file found!"
            exit 1
          fi

          # Extract package info
          PACKAGE_NAME=$(basename "$PACKAGE_FILE" | cut -d'_' -f1)
          PACKAGE_VERSION=$(basename "$PACKAGE_FILE" | sed 's/.*_\([0-9][^_]*\)_.*/\1/')

          echo "=== Publishing to Gitea Debian Repository ==="
          echo "Package: $PACKAGE_NAME"
          echo "Version: $PACKAGE_VERSION"
          echo "Distribution: ${{ matrix.codename }}"
          echo "Architecture: ${{ matrix.arch }}"
          echo "File: $PACKAGE_FILE"

          # Upload to Gitea Debian Package Repository
          # Use the codename as the distribution for better organization
          curl -f -H "Authorization: token $GITEA_TOKEN" \
            --upload-file "$PACKAGE_FILE" \
            "$GITEA_URL/api/packages/${{ github.repository_owner }}/debian/pool/${{ matrix.codename }}/main/upload"

          if [ $? -eq 0 ]; then
            echo ""
            echo "========================================="
            echo "✅ Successfully published $PACKAGE_NAME $PACKAGE_VERSION"
            echo "   Distribution: ${{ matrix.codename }}"
            echo "   Architecture: ${{ matrix.arch }}"
            echo "Repository URL: $GITEA_URL/${{ github.repository_owner }}/debian"
            echo "========================================="
          else
            echo "❌ Failed to publish package"
            exit 1
          fi

  publish-alpine:
    name: Publish Alpine to Package Registry
    needs: build-alpine
    if: startsWith(github.ref, 'refs/tags/release/')
    runs-on: linux_amd64
    strategy:
      matrix:
        include:
          - arch: arm64
            codename: stable

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v3
        with:
          name: alsa-avr-control-${{ matrix.codename }}-${{ matrix.arch }}
          path: packages/

      - name: Publish to Gitea Package Registry
        env:
          GITEA_TOKEN: ${{ secrets.PACKAGE_REGISTRY_TOKEN }}
          GITEA_URL: ${{ github.server_url }}
        run: |
          # Find the .deb file
          PACKAGE_FILE=$(ls packages/*.deb | head -1)

          if [ -z "$PACKAGE_FILE" ]; then
            echo "No package file found!"
            exit 1
          fi

          # Extract package info
          PACKAGE_NAME=$(basename "$PACKAGE_FILE" | cut -d'_' -f1)
          PACKAGE_VERSION=$(basename "$PACKAGE_FILE" | sed 's/.*_\([0-9][^_]*\)_.*/\1/')

          echo "=== Publishing Alpine-built package to Gitea Debian Repository ==="
          echo "Package: $PACKAGE_NAME"
          echo "Version: $PACKAGE_VERSION"
          echo "Distribution: ${{ matrix.codename }} (Alpine/musl-built)"
          echo "Architecture: ${{ matrix.arch }}"
          echo "File: $PACKAGE_FILE"

          # Upload to Gitea Debian Package Repository under "stable" distribution
          curl -f -H "Authorization: token $GITEA_TOKEN" \
            --upload-file "$PACKAGE_FILE" \
            "$GITEA_URL/api/packages/${{ github.repository_owner }}/debian/pool/${{ matrix.codename }}/main/upload"

          if [ $? -eq 0 ]; then
            echo ""
            echo "========================================="
            echo "✅ Successfully published $PACKAGE_NAME $PACKAGE_VERSION"
            echo "   Distribution: ${{ matrix.codename }} (Alpine/musl-built binaries)"
            echo "   Architecture: ${{ matrix.arch }}"
            echo "   Install location: /opt/alsa-avr-control-alpine/"
            echo ""
            echo "Install on Pi (for volume-mounting to Alpine containers):"
            echo "  echo 'deb $GITEA_URL/${{ github.repository_owner }}/debian stable main' | sudo tee /etc/apt/sources.list.d/martinmunk-alpine.list"
            echo "  sudo apt update"
            echo "  sudo apt install $PACKAGE_NAME"
            echo ""
            echo "Volume mount into Alpine containers:"
            echo "  -v /opt/alsa-avr-control-alpine/lib/alsa-lib:/usr/lib/alsa-lib:ro"
            echo "  -v /opt/alsa-avr-control-alpine/etc/alsa/conf.d:/etc/alsa/conf.d:ro"
            echo "========================================="
          else
            echo "❌ Failed to publish package"
            exit 1
          fi
