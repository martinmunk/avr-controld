version: '3.8'

services:
  shairport-sync:
    image: mikebrady/shairport-sync:latest
    container_name: shairport-sync
    restart: unless-stopped
    network_mode: host

    # Pass through ALSA devices
    devices:
      - /dev/snd:/dev/snd

    # Volume mount the Alpine-built plugins from Debian package
    volumes:
      # Mount ALSA plugins from martinmunk-alsa-control-avr-alpine package
      - /opt/alsa-avr-control-alpine/lib/alsa-lib:/usr/lib/alsa-lib:ro

      # Mount ALSA configuration files
      - /opt/alsa-avr-control-alpine/etc/alsa/conf.d:/etc/alsa/conf.d:ro

      # Optional: Mount your custom asound.conf
      # - ./docker-asound.conf:/etc/asound.conf:ro

      # Optional: Persistent shairport-sync config
      # - ./shairport-sync.conf:/etc/shairport-sync.conf:ro

    # Additional capabilities for audio
    cap_add:
      - SYS_NICE

    environment:
      # Optional: Set timezone
      - TZ=Europe/Copenhagen

