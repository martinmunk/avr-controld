# Local test ALSA configuration
# Uses installed plugin from /usr/local/lib/alsa-lib/

# Load plugin from installed location
pcm_type.denon {
    lib "/usr/local/lib/alsa-lib/libasound_module_ctl_denon.so"
}

ctl_type.denon {
    lib "/usr/local/lib/alsa-lib/libasound_module_ctl_denon.so"
}

# Define the control with mock server
ctl.denon {
    type denon
    host "127.0.0.1"
    port "23333"
    log_file "/tmp/alsa-avr-test.log"
    log_level "DEBUG"
}

# Make it default for testing
ctl.!default {
    type denon
    host "127.0.0.1"
    port "23333"
    log_file "/tmp/alsa-avr-test.log"
    log_level "DEBUG"
}
