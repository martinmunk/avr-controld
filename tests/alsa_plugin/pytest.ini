[pytest]
# Pytest configuration for ALSA plugin tests

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --color=yes

# Timeout for tests (seconds)
timeout = 30

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    hardware: marks tests that require real hardware
    mock: marks tests that work with mock server

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %H:%M:%S
