# Local test ALSA configuration for Opalum
# Uses installed plugin from /usr/local/lib/alsa-lib/

# Load plugin from installed location
pcm_type.opalum {
    lib "/usr/local/lib/alsa-lib/libasound_module_ctl_opalum.so"
}

ctl_type.opalum {
    lib "/usr/local/lib/alsa-lib/libasound_module_ctl_opalum.so"
}

# Define the control for Opalum serial device
ctl.opalum {
    type opalum
    device "/dev/ttyUSB0"
    log_file "/tmp/alsa-opalum-test.log"
    log_level "DEBUG"
}

# Make it default for testing
ctl.!default {
    type opalum
    device "/dev/ttyUSB0"
    log_file "/tmp/alsa-opalum-test.log"
    log_level "DEBUG"
}
