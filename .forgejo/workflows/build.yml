name: Test Debian Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DEBIAN_FRONTEND: noninteractive
  LANG: C.UTF-8

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: docker
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            codename: trixie
          - arch: arm64
            codename: trixie

    container:
      image: debian:trixie

    steps:
      - name: Install Node.js and git
        run: |
          apt-get update -qq
          apt-get install -y -qq git ca-certificates curl
          curl -fsSL https://deb.nodesource.com/setup_lts.x | bash -
          apt-get install -y -qq nodejs

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and verify (logged)
        run: |
          {
            set -ex
            df -h /
            apt-get install -y -qq dpkg-dev debhelper fakeroot cmake build-essential rsync devscripts file
            if [ "${{ matrix.arch }}" = "arm64" ]; then
              dpkg --add-architecture arm64
              apt-get update -qq
              apt-get install -y -qq crossbuild-essential-arm64 libasound2-dev:arm64 libasound2-dev
            else
              apt-get install -y -qq libasound2-dev
            fi
            df -h /
            if [ "${{ matrix.arch }}" != "$(dpkg --print-architecture)" ]; then
              TARGET_ARCH=${{ matrix.arch }} ./buildpackage.sh
            else
              ./buildpackage.sh
            fi
            ls -lh build-deb/*.deb
            bash .forgejo/verify-package.sh build-deb ${{ matrix.arch }}
          } 2>&1 | tee /tmp/build.log
          exit ${PIPESTATUS[0]}

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v3
        with:
          name: martinmunk-alsa-control-avr-${{ matrix.codename }}-${{ matrix.arch }}
          path: build-deb/*.deb

      # DIAGNOSTIC (temporary): logs/artifacts are inaccessible on this instance
      # and the repo has no PACKAGE_REGISTRY_TOKEN secret, so POST the captured
      # output to a listener on the dev box. LAST, so it also catches an
      # upload-artifact failure.
      - name: Ship build log on failure
        if: failure()
        run: |
          ls -l /tmp/build.log || echo "(no build.log)"
          curl -f -X PUT --data-binary @/tmp/build.log \
            "http://192.168.20.94:8099/r${{ github.run_number }}-${{ matrix.arch }}" \
            || echo "post failed (runner cannot reach 192.168.20.94:8099?)"
