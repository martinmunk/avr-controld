name: Test Debian Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DEBIAN_FRONTEND: noninteractive
  LANG: C.UTF-8

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: docker
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            codename: trixie
          - arch: arm64
            codename: trixie

    container:
      image: debian:trixie

    steps:
      - name: Install Node.js and git
        run: |
          apt-get update -qq
          apt-get install -y -qq git ca-certificates curl
          curl -fsSL https://deb.nodesource.com/setup_lts.x | bash -
          apt-get install -y -qq nodejs

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Everything (deps + build + verify) in one traced, fully-logged step so
      # that ANY failure point is captured to /tmp/build.log and shipped below.
      - name: Build and verify (logged)
        run: |
          {
            set -ex
            apt-get install -y -qq dpkg-dev debhelper fakeroot cmake build-essential rsync devscripts file
            if [ "${{ matrix.arch }}" = "arm64" ]; then
              dpkg --add-architecture arm64
              apt-get update -qq
              apt-get install -y -qq crossbuild-essential-arm64 libasound2-dev:arm64 libasound2-dev
            else
              apt-get install -y -qq libasound2-dev
            fi
            if [ "${{ matrix.arch }}" != "$(dpkg --print-architecture)" ]; then
              TARGET_ARCH=${{ matrix.arch }} ./buildpackage.sh
            else
              ./buildpackage.sh
            fi
            ls -lh build-deb/*.deb
            bash .forgejo/verify-package.sh build-deb ${{ matrix.arch }}
          } 2>&1 | tee /tmp/build.log
          exit ${PIPESTATUS[0]}

      # DIAGNOSTIC: artifact download + Actions logs are both inaccessible on
      # this instance, so on failure push the captured output to the generic
      # package registry, which IS downloadable with a token.
      - name: Ship build log on failure
        if: failure()
        env:
          TOKEN: ${{ secrets.PACKAGE_REGISTRY_TOKEN }}
          URL: ${{ github.server_url }}
        run: |
          ls -l /tmp/build.log || echo "(no build.log)"
          curl -f -H "Authorization: token $TOKEN" \
            --upload-file /tmp/build.log \
            "$URL/api/packages/${{ github.repository_owner }}/generic/ci-debug/r${{ github.run_number }}-${{ matrix.arch }}/build.log" \
            || echo "log upload failed"

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v3
        with:
          name: martinmunk-alsa-control-avr-${{ matrix.codename }}-${{ matrix.arch }}
          path: build-deb/*.deb
