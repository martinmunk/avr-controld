name: Test + package (avr-controld)

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
  pull_request:
  workflow_dispatch:

env:
  DEBIAN_FRONTEND: noninteractive
  LANG: C.UTF-8

jobs:
  python-tests:
    name: Python offline tests (avrcontrold)
    runs-on: docker
    container:
      image: debian:trixie
    steps:
      - name: Install Node.js and git
        run: |
          apt-get update -qq
          apt-get install -y -qq git ca-certificates curl
          curl -fsSL https://deb.nodesource.com/setup_lts.x | bash -
          apt-get install -y -qq nodejs

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Hermetic: system pytest from Debian, no pip/PyPI. The offline suite
      # imports avrcontrold from src/ and injects fakes -- no hardware, no MQTT
      # broker, no serial port, no runtime deps (nad_receiver/paho are lazy).
      - name: Install Python + pytest
        run: apt-get install -y -qq python3 python3-pytest

      - name: Run offline unit tests
        run: PYTHONPATH=src python3 -m pytest -q

  python-package:
    name: Build + verify package (arch all)
    runs-on: docker
    container:
      image: debian:trixie
    steps:
      - name: Install Node.js and git
        run: |
          apt-get update -qq
          apt-get install -y -qq git ca-certificates curl
          curl -fsSL https://deb.nodesource.com/setup_lts.x | bash -
          apt-get install -y -qq nodejs

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install packaging deps
        run: apt-get install -y -qq debhelper python3 python3-pip dpkg-dev fakeroot

      - name: Build package
        run: |
          dpkg-buildpackage -b --no-sign -rfakeroot
          ls -lh ../martinmunk-avr-controld_*_all.deb

      # In-job verification (this runner serves no Actions logs). Install the
      # freshly built package and prove the bundled library tree resolves all deps and
      # the daemon starts.
      - name: Verify package installs and runs
        run: |
          DEB=$(ls ../martinmunk-avr-controld_*_all.deb | head -1)
          dpkg -i "$DEB" || (apt-get -y -f install && dpkg -i "$DEB")
          /usr/bin/python3 -c "import sys; sys.path.insert(0, '/opt/avr-controld/lib'); import avrcontrold, nad_receiver, opalum_receiver, paho.mqtt.client, serial, jeepney; print('library tree imports OK')"
          timeout 2 /opt/avr-controld/bin/avr-controld -o backend=demo -o node_id=ci -o poll_interval=1 || true
          echo "package verify OK"
