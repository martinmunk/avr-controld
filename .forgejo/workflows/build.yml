name: Test Debian Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DEBIAN_FRONTEND: noninteractive
  LANG: C.UTF-8

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: docker
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            codename: trixie
          - arch: arm64
            codename: trixie

    container:
      image: debian:trixie

    steps:
      - name: Install Node.js and git
        run: |
          apt-get update -qq
          apt-get install -y -qq git ca-certificates curl
          curl -fsSL https://deb.nodesource.com/setup_lts.x | bash -
          apt-get install -y -qq nodejs

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build tools
        run: |
          apt-get install -y -qq dpkg-dev debhelper fakeroot cmake build-essential rsync devscripts file

      - name: Add arm64 architecture and cross toolchain
        if: matrix.arch == 'arm64'
        run: |
          dpkg --add-architecture arm64
          apt-get update -qq
          # native libasound2-dev too, so buildpackage.sh's dpkg-checkbuilddeps
          # is satisfied and it doesn't fall into the mk-build-deps/equivs path
          apt-get install -y -qq crossbuild-essential-arm64 libasound2-dev:arm64 libasound2-dev

      - name: Install native build dependencies (amd64)
        if: matrix.arch == 'amd64'
        run: |
          apt-get install -y -qq libasound2-dev

      - name: Build package (buildpackage.sh stamps +debian<N><codename>)
        run: |
          if [ "${{ matrix.arch }}" != "$(dpkg --print-architecture)" ]; then
            TARGET_ARCH=${{ matrix.arch }} ./buildpackage.sh
          else
            ./buildpackage.sh
          fi
          ls -lh build-deb/*.deb

      # Asserted in-job on purpose: this Forgejo instance does not serve Actions
      # job logs afterwards, so a wrong/incomplete package must fail here.
      - name: Verify built package
        run: bash .forgejo/verify-package.sh build-deb ${{ matrix.arch }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: martinmunk-alsa-control-avr-${{ matrix.codename }}-${{ matrix.arch }}
          path: build-deb/*.deb
