name: Build and Publish avr-controld

on:
  push:
    tags:
      - 'release/*'
  workflow_dispatch:

env:
  DEBIAN_FRONTEND: noninteractive
  LANG: C.UTF-8

jobs:
  publish-python:
    name: Build & Publish venv package (arch all)
    runs-on: docker
    container:
      image: debian:trixie
    steps:
      - name: Install Node.js and git
        run: |
          apt-get update -qq
          apt-get install -y -qq git ca-certificates curl
          curl -fsSL https://deb.nodesource.com/setup_lts.x | bash -
          apt-get install -y -qq nodejs

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install packaging deps
        run: apt-get install -y -qq debhelper python3 python3-venv python3-pip dpkg-dev fakeroot

      - name: Build venv package
        run: |
          dpkg-buildpackage -b --no-sign -rfakeroot
          ls -lh ../martinmunk-avr-controld_*_all.deb

      - name: Verify package installs and runs
        run: |
          DEB=$(ls ../martinmunk-avr-controld_*_all.deb | head -1)
          dpkg -i "$DEB" || (apt-get -y -f install && dpkg -i "$DEB")
          /opt/avr-controld/venv/bin/python -c "import avrcontrold, nad_receiver, opalum_receiver, paho.mqtt.client, serial, jeepney; print('venv imports OK')"

      - name: Publish to Forgejo Package Registry
        env:
          FORGEJO_TOKEN: ${{ secrets.PACKAGE_REGISTRY_TOKEN }}
          FORGEJO_URL: ${{ github.server_url }}
        run: |
          set -eu
          PACKAGE_FILE=$(ls ../martinmunk-avr-controld_*_all.deb | head -1)
          echo "Publishing $PACKAGE_FILE to debian/trixie/main"
          code=$(curl -s -o /tmp/upload.out -w '%{http_code}' -H "Authorization: token $FORGEJO_TOKEN" \
            --upload-file "$PACKAGE_FILE" \
            "$FORGEJO_URL/api/packages/${{ github.repository_owner }}/debian/pool/trixie/main/upload")
          echo "HTTP $code"; cat /tmp/upload.out 2>/dev/null || true; echo
          case "$code" in
            201|202) echo "published" ;;
            409) echo "this version already exists in the registry - skipping (idempotent)" ;;
            *) echo "upload failed (HTTP $code)"; exit 1 ;;
          esac
          echo "Published $(basename "$PACKAGE_FILE")"
