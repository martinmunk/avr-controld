# Denon/Marantz AVR Control via TCP/IP
#
# Usage in ~/.asoundrc or /etc/asound.conf:
#   ctl.!default {
#       type denon
#       host "192.168.1.100"
#   }

ctl.denon {
	@args [ HOST PORT INPUT LOG_FILE LOG_LEVEL ]
	@args.HOST {
		type string
		default "192.168.1.100"
	}
	@args.PORT {
		type string
		default "23"
	}
	@args.INPUT {
		type string
		default ""
	}
	@args.LOG_FILE {
		type string
		default ""
	}
	@args.LOG_LEVEL {
		type string
		default "INFO"
	}
	type denon
	host $HOST
	port $PORT
	input $INPUT
	log_file $LOG_FILE
	log_level $LOG_LEVEL
	hint {
		show {
			@func refer
			name defaults.namehint.basic
		}
		description "Denon/Marantz AVR via TCP/IP"
	}
}
