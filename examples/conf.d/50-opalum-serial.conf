# Opalum Amplifier Control via Serial/RS-232
#
# Usage in ~/.asoundrc or /etc/asound.conf:
#   ctl.!default {
#       type opalum
#       device "/dev/ttyUSB0"
#   }

ctl.opalum {
	@args [ DEVICE INPUT LOG_FILE LOG_LEVEL ]
	@args.DEVICE {
		type string
		default "/dev/ttyUSB0"
	}
	@args.INPUT {
		type string
		default ""
	}
	@args.LOG_FILE {
		type string
		default ""
	}
	@args.LOG_LEVEL {
		type string
		default "INFO"
	}
	type opalum
	device $DEVICE
	input $INPUT
	log_file $LOG_FILE
	log_level $LOG_LEVEL
	hint {
		show {
			@func refer
			name defaults.namehint.basic
		}
		description "Opalum Amplifier via Serial/RS-232"
	}
}
