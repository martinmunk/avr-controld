# NAD Amplifier Control via Serial/RS-232
#
# Usage in ~/.asoundrc or /etc/asound.conf:
#   ctl.!default {
#       type nad
#       device "/dev/ttyUSB0"
#   }

ctl.nad_serial {
	@args [ DEVICE LOG_FILE LOG_LEVEL ]
	@args.DEVICE {
		type string
		default "/dev/ttyUSB0"
	}
	@args.LOG_FILE {
		type string
		default ""
	}
	@args.LOG_LEVEL {
		type string
		default "INFO"
	}
	type nad
	device $DEVICE
	log_file $LOG_FILE
	log_level $LOG_LEVEL
	hint {
		show {
			@func refer
			name defaults.namehint.basic
		}
		description "NAD Amplifier via Serial/RS-232"
	}
}
