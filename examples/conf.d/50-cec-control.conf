# HDMI-CEC Audio Control
#
# Usage in ~/.asoundrc or /etc/asound.conf:
#   ctl.!default {
#       type cec
#   }

ctl.cec_audio {
	@args [ INITIAL_VOLUME LOG_FILE LOG_LEVEL ]
	@args.INITIAL_VOLUME {
		type string
		default "50"
	}
	@args.LOG_FILE {
		type string
		default ""
	}
	@args.LOG_LEVEL {
		type string
		default "INFO"
	}
	type cec
	initial_volume $INITIAL_VOLUME
	log_file $LOG_FILE
	log_level $LOG_LEVEL
	hint {
		show {
			@func refer
			name defaults.namehint.basic
		}
		description "HDMI-CEC Audio System Control"
	}
}
