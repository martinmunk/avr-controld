# /etc/avr-controld/config.conf -- avr-controld (Python) configuration.
# key=value; '#' starts a comment.

# ---- receiver ----
backend=nad
# Prefer the stable by-id path (survives replug/reboot; /dev/ttyUSBn can renumber),
# e.g. /dev/serial/by-id/usb-Prolific_Technology_Inc._USB-Serial_Controller-if00-port0
device=/dev/ttyUSB0
# NAD volume dB range mapped to 0-100 (calibrate per unit if needed):
min_db=-80
max_db=0
# Comma-separated source names to expose as an HA "input" select (optional):
# sources=Source 1,Source 2,Source 3

# ---- Home Assistant identity ----
name=Living Room NAD
manufacturer=NAD
model=T757
# node_id defaults to sanitized "<backend>_<device>" if unset.

# ---- MQTT broker ----
mqtt_host=mqtt.service
mqtt_port=1883
mqtt_user=tasmota
# Prefer MQTT_PASS in the environment (systemd EnvironmentFile) over the file:
# mqtt_pass=...
discovery_prefix=homeassistant

# ---- safety ----
# Hard ceiling on any absolute volume this daemon will set (0-100). Note the
# phone slider is CLAMPED to it, not scaled into it: with max_volume=50 the
# upper half of the AirPlay slider does nothing.
max_volume=80

# ---- AirPlay slider -> receiver volume ----
# airplay_curve: flat (default; linear in dB, i.e. 50% of the slider = 50% of the
# receiver's range) or standard (shairport-sync's own mixer taper, vol2attn:
# a third of the slider ~55%, half ~70%). A receiver that used to be driven by
# shairport through the ALSA mixer plugins had "standard"; keep it to keep the feel.
# airplay_curve=flat
# AirPlay dB at the bottom of the slider (shairport reports [-30, 0]; -144 = mute):
# airplay_min_db=-30

poll_interval=5

# --- Opalum (serial, write-only protocol) -------------------------------------
# backend=opalum
# device=/dev/serial/by-id/usb-Prolific_Technology_Inc._USB-Serial_Controller-if00-port0
# node_id=vaerkstedstaerten_opalum
# name=Værksted Opalum
# manufacturer=Opalum
# max_volume=100           # ceiling (0-100); the slider is clamped to it, not scaled
# airplay_curve=standard   # the Opalum's 0-99 steps are dB-ish: keep shairport's taper
# power_policy=on          # shairport playing -> power on + source; off after off_grace
# shairport=1              # watch shairport-sync on the system D-Bus
# airplay_input=Mixer      # Opalum source the Pi feeds (Toslink1..Mixer)
# off_grace=30
