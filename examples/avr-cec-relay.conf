# /etc/avr-cec-relay.conf -- configuration for avr-cec-relay.
# Lines are key=value; '#' starts a comment. All keys are optional.

# CEC character device (the Pi's HDMI-CEC adapter).
cec_device=/dev/cec0

# Which avr-controld backend + device to relay volume to. The socket path is
# derived from these exactly as avr-controld computes it, so they must match the
# running daemon's --type and -o device=.
avr_type=nad_serial
# Prefer the stable by-id path (survives replug/reboot; /dev/ttyUSBn can renumber),
# e.g. /dev/serial/by-id/usb-Prolific_Technology_Inc._USB-Serial_Controller-if00-port0
avr_device=/dev/ttyUSB0

# Or pin the socket path explicitly (overrides avr_type/avr_device derivation):
# avr_socket=/run/avr-controld/nad_serial__dev_ttyUSB0.sock

# Hard ceiling on relayed volume-up. Even with a human on the remote, the relay
# will not walk the receiver above this. 0-100.
max_volume=80

# CEC OSD name shown in the TV's device list.
osd_name=PiAudio

# TV logical address (almost always 0).
tv_addr=0

# Power policy: the relay watches the CEC bus for TV/setup activity and tells
# the daemon (DEMAND verb) when the receiver is needed. On power-on it selects
# this receiver input (the one the TV feeds, e.g. the NAD optical for TV Toslink).
# Leave empty to power on without switching input. Requires the daemon to run
# with power_policy=on.
cec_input=
# How often (seconds) to poll the TV's CEC power status.
tv_poll_secs=10
