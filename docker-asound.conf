# ALSA configuration for Docker container

# AVR combined device: PCM goes to Pi headphone jack, Control goes to AVR plugin
pcm.avr {
    type plug
    slave.pcm "plughw:Headphones"
}

# AVR control plugin - NAD Serial
ctl.avr {
    type avr
    backend "nad_serial"
    device "/dev/ttyUSB0"
    log_file "/var/log/alsa-avr/nad.log"
    log_level "INFO"
}

# Default control uses hardware (not AVR) to avoid errors when AVR is off
# Shairport-sync explicitly uses "-c avr" so this won't affect it
ctl.!default {
    type hw
    card 0
}
